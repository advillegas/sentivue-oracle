[project]
name = "oracle-env"
version = "1.0.0"
description = "SentiVue Oracle — offline quant/ML Python stack (uv-managed)"
requires-python = ">=3.12,<3.13"
dependencies = [
    # core numerics & data
    "numpy>=2.1,<3",
    "pandas>=2.2,<3",
    "polars>=1.19,<2",
    "pyarrow>=18,<20",
    "duckdb>=1.1,<2",
    "scipy>=1.14,<2",
    "numba>=0.60,<1",
    "sympy>=1.13,<2",
    # statistics & econometrics
    "statsmodels>=0.14,<1",
    "arch>=7,<8",                    # GARCH-family volatility models
    "scikit-learn>=1.5,<2",
    # gradient boosting & deep learning (torch uses MPS on Apple Silicon)
    "xgboost>=2.1,<3",
    "lightgbm>=4.5,<5",
    "torch>=2.5,<3",
    # optimization & pricing
    "cvxpy>=1.6,<2",
    "QuantLib>=1.36,<2",
    # backtesting
    "backtesting>=0.3.3,<1",
    # experiment tracking (offline: file/localhost backend)
    "mlflow>=2.19,<3",
    # tuning & interpretability
    "optuna>=4.1,<5",
    "shap>=0.46,<1",
    # plotting & notebooks
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<1",
    "plotly>=5.24,<6",
    "jupyterlab>=4.3,<5",
    # db clients
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
    # test runner (mission deterministic checks run pytest)
    "pytest>=8,<9",
]

[project.optional-dependencies]
trading = [
    "nautilus_trader>=1.210,<2",     # production-grade event-driven backtests/live
    "vectorbt>=0.26,<1",             # fast vectorized parameter sweeps
]

[tool.uv]
package = false
