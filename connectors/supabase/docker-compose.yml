# Self-hosted Supabase (minimal, offline-friendly, localhost-only).
# Postgres + PostgREST + postgres-meta + Studio. Includes pgvector.
# Image tags mirror VERSIONS.lock — keep them in sync.
#
#   cp .env.example .env   (set a real password)
#   make supabase-up
#
# DB:      postgresql://postgres:<pw>@127.0.0.1:54322/postgres
# REST:    http://127.0.0.1:54321
# Studio:  http://127.0.0.1:54323

name: sentivue-supabase

services:
  db:
    image: supabase/postgres:15.8.1.135
    ports:
      - "127.0.0.1:54322:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: postgres
    volumes:
      - ./volumes/db:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  rest:
    image: postgrest/postgrest:v12.2.12
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:54321:3000"
    environment:
      PGRST_DB_URI: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: postgres
      PGRST_JWT_SECRET: ${JWT_SECRET:-oracle-local-jwt-secret-change-me-0000}
    restart: unless-stopped

  meta:
    image: supabase/postgres-meta:v0.91.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
    restart: unless-stopped

  studio:
    image: supabase/studio:2026.07.07-sha-a6a04f2
    depends_on:
      - meta
      - rest
    ports:
      - "127.0.0.1:54323:3000"
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      SUPABASE_URL: http://rest:3000
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    restart: unless-stopped
