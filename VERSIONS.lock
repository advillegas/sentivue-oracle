# SentiVue Oracle — pinned versions (single source of truth for bootstrap)
# Exact values are installed as written. Dynamic/unresolved values are acquisition
# inputs only: release/install reject them until independently verified identity
# and digest data are promoted through named keys here or the generated tracked
# verification/dependency-authorities.json manifest.
# Bump deliberately, one at a time, and re-run `make verify` after any change.
#
# BEFORE FIRST BOOTSTRAP on the Mac: sanity-check that each pin still exists
# (npm view <pkg> versions; the GitHub releases pages; docker manifest inspect).
# If a pin was yanked or the release asset name changed, bump it here — nothing
# else in the repo hardcodes versions.

