# SentiVue Oracle — pinned versions (single source of truth for bootstrap)
# Everything here is installed exactly at these versions. Bump deliberately, one at a time,
# and re-run `make verify` after any change.
#
# BEFORE FIRST BOOTSTRAP on the Mac: sanity-check that each pin still exists
# (npm view <pkg> versions; the GitHub releases pages; docker manifest inspect).
# If a pin was yanked or the release asset name changed, bump it here — nothing
# else in the repo hardcodes versions.

# --- engines (verified on npm 2026-07-09) ---
# Note: npm install of Claude Code is officially deprecated in favor of the native
# installer, but we use npm DELIBERATELY: it pins an exact version and does not
# auto-update in the background (auto-update is wrong for an air-gapped appliance).
# Requires Node 22+ (installed by bootstrap).
CLAUDE_CODE_NPM_VERSION=2.1.205         # npm: @anthropic-ai/claude-code
OPENCODE_NPM_VERSION=1.17.16            # npm: opencode-ai

# --- harness ---
ECC_REPO=https://github.com/affaan-m/ECC
ECC_PIN=v2.0.0                          # tag; curated subset only (see harness/ecc/profile.txt)
AGENT_MCP_REPO=https://github.com/rinadelph/Agent-MCP
AGENT_MCP_PIN=v4.20.1                   # tag verified 2026-07-10; orchestration viewer (dashboard)
LOOP_ENG_REPO=https://github.com/cobusgreyling/loop-engineering
LOOP_ENG_PIN=v1.5.0                     # tag verified 2026-07-10; patterns/docs vendored
LOOP_AUDIT_NPM=1.6.0                    # @cobusgreyling/loop-audit  (readiness score)
LOOP_INIT_NPM=1.3.3                     # @cobusgreyling/loop-init   (scaffold)
LOOP_COST_NPM=1.0.3                     # @cobusgreyling/loop-cost   (token estimator)
LOOP_SYNC_NPM=1.0.0                     # @cobusgreyling/loop-sync   (STATE/LOOP drift)
SUPERPOWERS_REPO=https://github.com/obra/superpowers
SUPERPOWERS_PIN=v6.1.1                  # tag verified 2026-07-10; 252k stars, MIT
GSTACK_REPO=https://github.com/garrytan/gstack
GSTACK_PIN=7c9df1c568a9ea745508f679a329332b2c338063  # main 2026-07-10 (no tags); 121k stars, MIT

# --- serving (verified on GitHub releases 2026-07-09/10) ---
LLAMA_CPP_BREW_FORMULA=llama.cpp        # brew pin after install (Mac)
LLAMA_SWAP_VERSION=v236                 # github: mostlygeek/llama-swap
                                        # assets: ..._darwin_arm64.tar.gz / ..._windows_amd64.zip
LLAMA_CPP_WIN_TAG=b9948                 # github: ggml-org/llama.cpp
                                        # asset: llama-b9948-bin-win-vulkan-x64.zip (AMD/Intel/NVIDIA)
                                        # (serve-windows.ps1 carries these two pins)

# --- tooling ---
NODE_MAJOR=22
UV_INSTALL=brew                         # uv via homebrew
HF_CLI=huggingface_hub[cli]             # provides `hf download`
GITEA_BREW_FORMULA=gitea                # optional vault UI; brew pin after install
VSCODIUM_CASK=vscodium                  # IDE; Continue + Kilo Code .vsix versions are
                                        # resolved at install from open-vsx (latest)
                                        # and recorded in incoming/PROVENANCE.md
RUST_BREW_FORMULA=rust                  # builds desk/ (oracle-desk frontend); pin after install
                                        # crate pins live in desk/Cargo.toml (eframe 0.29)

# --- supabase (docker images; verified on Docker Hub 2026-07-09, all arm64) ---
SUPABASE_POSTGRES_IMAGE=supabase/postgres:15.8.1.135
POSTGREST_IMAGE=postgrest/postgrest:v12.2.12
POSTGRES_META_IMAGE=supabase/postgres-meta:v0.91.0
SUPABASE_STUDIO_IMAGE=supabase/studio:2026.07.07-sha-a6a04f2

# --- mcp servers (verified on PyPI 2026-07-09; warmed into uv caches at bootstrap) ---
MCP_DUCKDB=mcp-server-duckdb==1.1.0     # uvx (ktanaka101)
MCP_POSTGRES=postgres-mcp==0.3.0        # uvx (crystaldba)

# --- model files: resolved SHAs are appended by download-models.sh below this line ---
