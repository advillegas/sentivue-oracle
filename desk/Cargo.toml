[package]
name = "oracle-desk"
version = "0.1.0"
edition = "2021"
description = "SentiVue Oracle - native desktop frontend (no webview, no browser)"

[dependencies]
eframe = "0.29"
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
# default-features off: we only talk to 127.0.0.1, so no TLS stack — and no TLS
# means no C compiler needed, which keeps the self-contained GNU toolchain build
# working on Windows machines without Visual Studio.
ureq = { version = "2", features = ["json"], default-features = false }

[profile.release]
lto = true
strip = true
