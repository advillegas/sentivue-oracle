name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install "pytest>=8,<9"
      - name: Install pinned uv
        shell: powershell
        run: |
          $line = Get-Content VERSIONS.lock | Where-Object { $_ -match '^UV_VERSION=' }
          $version = (((($line -split '=', 2)[1]) -split '#', 2)[0]).Trim()
          python -m pip install "uv==$version"
      - name: Verify uv lock equivalence
        working-directory: env
        run: uv lock --check
      - name: Run verifier tests
        run: python -m pytest verification/tests -q
      - name: Run shared verifier
        shell: powershell
        run: verification/verify.ps1 -StaticOnly

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install "pytest>=8,<9"
      - name: Install pinned uv
        run: |
          version="$(awk -F= '$1 == "UV_VERSION" {sub(/[[:space:]]*#.*/, "", $2); print $2}' VERSIONS.lock)"
          python -m pip install "uv==$version"
      - name: Verify uv lock equivalence
        working-directory: env
        run: uv lock --check
      - name: Run verifier tests
        run: python -m pytest verification/tests -q
      - name: Run shared verifier
        run: bash verification/verify.sh --static-only
